; /etc/supervisor/conf.d/operations-worker.conf
;
; "Boshqaruv" sahifasidagi tugmalar (CRM login, Pipeline, Telegram, Barcha
; scraping) uchun queue worker — RunOperationJob, "operations" navbati.
;
; user=root: bu worker cron'dagi `schedule:run` (root crontab) bilan aynan
; bir xil buyruqlarni ishga tushiradi va o'sha fayllarga yozadi. Jadval
; mutex'i mos kelishi uchun ham cron kabi oddiy `php` bilan ishga tushadi.
;
; O'rnatish:
;   cp deploy/supervisor/operations-worker.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update

[program:laravel-worker-operations]
command=php /var/www/www-root/data/www/scrape.izisol.uz/artisan queue:work database --queue=operations --timeout=7000 --memory=512 --tries=1 --sleep=3
directory=/var/www/www-root/data/www/scrape.izisol.uz
user=root
autostart=true
autorestart=true
stopwaitsecs=7300
stdout_logfile=/var/www/www-root/data/www/scrape.izisol.uz/storage/logs/worker-operations.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/www/www-root/data/www/scrape.izisol.uz/storage/logs/worker-operations-error.log
stderr_logfile_maxbytes=10MB
