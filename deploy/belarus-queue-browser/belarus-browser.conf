; /etc/supervisor/conf.d/belarus-browser.conf
;
; Belarus navbati uchun serverdagi ko'rinadigan brauzer (captcha'ni odam yechadi):
;   Xvfb (virtual ekran :99) -> Google Chrome (mon.declarant.by + kengaytma)
;   -> x11vnc (faqat 127.0.0.1:5900) -> noVNC/websockify (faqat 127.0.0.1:6080)
;   -> nginx /belarus-vnc/ (HTTPS + parol, belarus-vnc.nginx.conf)
; Hech bir port tashqariga ochilmaydi — faqat nginx orqali, parol bilan.
; O'rnatish: deploy/belarus-queue-browser/README.md

[group:belarus-browser]
programs=belarus-xvfb,belarus-chrome,belarus-x11vnc,belarus-novnc

[program:belarus-xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1280x900x24 -nolisten tcp
user=belarus
autostart=true
autorestart=true
priority=10
stdout_logfile=/home/belarus/logs/xvfb.log
redirect_stderr=true

[program:belarus-chrome]
command=/usr/bin/google-chrome --user-data-dir=/home/belarus/chrome-profile --no-first-run --no-default-browser-check --disable-dev-shm-usage --window-position=0,0 --window-size=1280,900 --start-maximized https://mon.declarant.by/#/zone/benyakoni
environment=DISPLAY=":99",HOME="/home/belarus"
user=belarus
autostart=true
autorestart=true
startsecs=10
priority=20
stdout_logfile=/home/belarus/logs/chrome.log
redirect_stderr=true

[program:belarus-x11vnc]
command=/usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -nopw -forever -shared -noxdamage -quiet
user=belarus
autostart=true
autorestart=true
priority=30
stdout_logfile=/home/belarus/logs/x11vnc.log
redirect_stderr=true

[program:belarus-novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=belarus
autostart=true
autorestart=true
priority=40
stdout_logfile=/home/belarus/logs/novnc.log
redirect_stderr=true
