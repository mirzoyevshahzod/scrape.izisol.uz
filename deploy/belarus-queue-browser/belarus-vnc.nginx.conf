# /etc/nginx/vhosts-includes/belarus-vnc.conf (ISPmanager barcha saytlar server{} blokiga qo'shadi)
#
# Masofaviy brauzer oynasi (noVNC): https://scrape.izisol.uz/belarus-vnc/vnc.html?...
# Parol: /etc/nginx/belarus-vnc.htpasswd (README.md). websockify faqat 127.0.0.1 da.

location /belarus-vnc/ {
    auth_basic "Belarus navbati";
    auth_basic_user_file /etc/nginx/belarus-vnc.htpasswd;

    proxy_pass http://127.0.0.1:6080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
